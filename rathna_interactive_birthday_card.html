<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b98b61">
<title>A birthday surprise for Rathna</title>
<style>
:root{--paper:#ead3b5;--ink:#50382b;--red:#a93239;--cream:#fff1df}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background-color:#b98b61;background-image:radial-gradient(#fff4 1px,transparent 1px),linear-gradient(135deg,#c99f78,#9f704d);background-size:14px 14px,cover;color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;overflow-x:hidden;padding:28px 14px}
.stage{width:min(100%,900px);min-height:calc(100svh - 56px);display:grid;place-items:center;position:relative;perspective:1800px}
.cover-wrap{width:min(88vw,390px);aspect-ratio:633/789;position:relative;filter:drop-shadow(0 18px 20px #50301c66);transition:transform .7s,opacity .5s;cursor:pointer;transform-origin:left center}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block;border:8px solid #f5e4cd;outline:1px solid #79543a}
.cover-wrap:after{content:"OPEN YOUR SURPRISE ✦";position:absolute;bottom:-36px;left:0;right:0;text-align:center;color:#fff3df;font:600 12px/1.2 Arial,sans-serif;letter-spacing:.2em}
.spread{display:none;width:min(96vw,820px);grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,18px);align-items:stretch;position:relative;filter:drop-shadow(0 16px 18px #42271966);animation:arrive .75s ease both}
.spread.open{display:grid}
@keyframes arrive{from{opacity:0;transform:rotateY(-8deg) scale(.94)}to{opacity:1;transform:none}}
.page{min-width:0;aspect-ratio:633/789;position:relative;background:#f7e8d5;border:7px solid #f5e5cf;outline:1px solid #805a3d;overflow:hidden}
.page:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,#7a4d2410 0 1px,transparent 1px 5px);mix-blend-mode:multiply}
.left-page{background:#ead1ad}
.envelope-scene{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#fff2d7 0 35%,transparent 72%),#e8cfac}
.envelope-sticker{position:absolute;width:28%;height:auto;top:7%;left:6%;transform:rotate(-9deg);filter:drop-shadow(2px 4px 2px #5b342b55);z-index:1}
.envelope{position:absolute;width:76%;height:43%;bottom:13%;background:linear-gradient(145deg,#a92e35,#7e2028);border:2px solid #6d2425;box-shadow:0 10px 15px #613c2b55;z-index:2;overflow:hidden}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.5%,#e9b7a0 50%,transparent 50.7%),linear-gradient(225deg,transparent 49.5%,#d78e7e 50%,transparent 50.7%);opacity:.75}
.envelope:after{content:"";position:absolute;left:0;right:0;top:-1px;height:65%;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(135deg,#bd4a4a,#8f252c);border-bottom:1px solid #e7b6a0;transform-origin:top;transition:transform .55s;z-index:4}
.envelope.opened:after{transform:rotateX(180deg)}
.letter-insert{position:absolute;width:69%;height:58%;bottom:31%;left:15.5%;background:#fff0dd;border:1px solid #c7a783;box-shadow:0 4px 8px #54351f44;z-index:1;transition:transform .7s cubic-bezier(.2,.8,.2,1),z-index 0s .35s;overflow:hidden}
.letter-insert img{width:100%;height:100%;object-fit:cover;object-position:center}
.letter-insert.lifted{transform:translateY(-26%) scale(1.04);z-index:8;transition:transform .7s cubic-bezier(.2,.8,.2,1),z-index 0s}
.tap-hint{position:absolute;bottom:4%;left:0;right:0;text-align:center;font:600 11px Arial,sans-serif;letter-spacing:.12em;color:#68412e;z-index:5}
.right-page{background:#f6e0c6}
.cake-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.flame{position:absolute;width:10%;height:15%;z-index:3;transform-origin:50% 90%;transition:transform .18s;filter:drop-shadow(0 1px 1px #8a402e55)}
.flame svg{width:100%;height:100%;overflow:visible}
.flame.out{opacity:0;transform:scale(.2) translateY(12px);transition:opacity .3s,transform .3s}
.flame.bending{transform:rotate(22deg) skewX(-12deg) scaleX(.82)}
/* Soft paper patches cover the original drawn flame tips so the animated cut-outs read as separate stickers. */
.flame-patch{position:absolute;width:11%;height:10%;z-index:2;background:#f9e7d4;border-radius:48% 48% 35% 35%;filter:blur(1px)}
.patch1{left:27.3%;top:48.3%}.patch2{left:44.1%;top:48.3%}.patch3{left:60.7%;top:48.3%}
.flame.f1{left:28%;top:39.2%}.flame.f2{left:44.7%;top:39.2%}.flame.f3{left:61.3%;top:39.2%}
.candle-instruction{position:absolute;left:7%;right:7%;top:5%;text-align:center;font-size:clamp(12px,2vw,18px);font-weight:bold;letter-spacing:.08em;color:#713e37;text-shadow:0 1px #fff5;z-index:5}
.wish{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:12%;z-index:7;background:#f7e4ccdc;font-size:clamp(19px,3vw,30px);font-weight:bold;color:#9c303b}
.wish.show{display:grid;animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.confetti i{position:absolute;top:-12%;width:8px;height:13px;background:#b53642;animation:fall 2.8s linear infinite}
.confetti i:nth-child(3n){background:#e7b84d}.confetti i:nth-child(3n+1){background:#4d8c65}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
.controls{position:absolute;left:0;right:0;bottom:-62px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
button{border:1px solid #724b36;background:#fff0dc;color:#563b2b;border-radius:999px;padding:10px 15px;font:600 12px Arial,sans-serif;letter-spacing:.03em;box-shadow:0 3px 0 #815b43;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #815b43}
button.primary{background:#a72f39;color:#fff4e5;border-color:#77242b}
button:focus-visible{outline:3px solid #f3c85c;outline-offset:3px}
.mic-panel{position:absolute;left:7%;right:7%;bottom:5%;z-index:6;text-align:center;font:11px Arial,sans-serif;color:#69483a}
.meter{height:7px;background:#d5bda4;border-radius:9px;overflow:hidden;margin:7px auto;width:75%;max-width:210px}
.meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,#7b9b63,#e5ad4c,#b3333b);transition:width .08s}
.status{min-height:14px}
#closedControls{display:none}
.back{position:fixed;top:14px;left:14px;z-index:20;display:none}
.back.show{display:block}
.note{position:fixed;bottom:8px;left:12px;right:12px;text-align:center;color:#fff1df;font:11px/1.4 Arial,sans-serif;text-shadow:0 1px 2px #4d2c1c}
@media(max-width:560px){
 body{padding:22px 8px 70px}.stage{min-height:calc(100svh - 92px)}
 .spread{width:min(98vw,700px);gap:5px}
 .page{border-width:4px}
 .controls{bottom:-58px}
 .page .tap-hint{font-size:9px}
 .mic-panel{bottom:3%;font-size:9px}
 .flame-patch{height:8%}
}
@media(max-height:650px){.stage{min-height:520px}.cover-wrap{width:min(65vw,300px)}.spread{width:min(90vw,650px)}}
</style>
</head>

      <div class="flame f3"><svg viewBox="0 0 50 80" aria-hidden="true"><path d="M25 3 C5 25 8 38 25 54 C42 38 45 25 25 3Z" fill="#f6b33d" stroke="#a64b32" stroke-width="2"/><path d="M25 20 C16 33 19 39 25 45 C32 37 33 30 25 20Z" fill="#fff0a4"/></svg></div>
      <div class="wish" id="wish">MAKE A WISH,<br>RATHNA! ✨</div>
      <div class="confetti" id="confetti"></div>
      <div class="mic-panel">
        <div class="meter"><span id="meterFill"></span></div>
        <div class="status" id="status">Tap “Use microphone” or press and hold to blow.</div>
      </div>
    </article>
    <div class="controls">
      <button id="micBtn" class="primary">Use microphone</button>
      <button id="holdBtn" aria-label="Press and hold to blow">Hold to blow</button>
      <button id="relightBtn" style="display:none">↻ Relight candles</button>
    </div>
  </section>
</main>
<div class="note">Microphone blowing works on an HTTPS-hosted link (not when opened as a local file). Hold-to-blow works without a microphone.</div>
<script>
const cover=document.getElementById('cover'), spread=document.getElementById('spread'), backBtn=document.getElementById('backBtn');
const letterInsert=document.getElementById('letterInsert'), envelope=document.getElementById('envelope');
const flames=[...document.querySelectorAll('.flame')], patches=[...document.querySelectorAll('.flame-patch')];
const statusEl=document.getElementById('status'), meterFill=document.getElementById('meterFill');
const micBtn=document.getElementById('micBtn'), holdBtn=document.getElementById('holdBtn'), relightBtn=document.getElementById('relightBtn');
const wish=document.getElementById('wish'), confetti=document.getElementById('confetti');
let audioCtx=null, analyser=null, micStream=null, raf=null, blowingSince=0, extinguished=false, holdActive=false, micActive=false;

function openCard(){
  cover.style.display='none'; spread.classList.add('open'); backBtn.classList.add('show');
  document.querySelector('.stage').style.minHeight='calc(100svh - 56px)';
}
function closeCard(){
  spread.classList.remove('open'); backBtn.classList.remove('show');
  cover.style.display='block'; letterInsert.classList.remove('lifted'); envelope.classList.remove('opened');
}
cover.addEventListener('click',openCard);
cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard()}});
backBtn.addEventListener('click',closeCard);
letterInsert.addEventListener('click',()=>{const lifted=letterInsert.classList.toggle('lifted');envelope.classList.toggle('opened',lifted)});

function setLevel(v){meterFill.style.width=Math.min(100,Math.round(v*100))+'%'}
function bend(on){flames.forEach(f=>f.classList.toggle('bending',on))}
function blowOut(){
  if(extinguished)return;
  extinguished=true; flames.forEach(f=>f.classList.add('out')); patches.forEach(p=>p.style.opacity='0');
  wish.classList.add('show'); relightBtn.style.display='inline-block'; holdBtn.disabled=true;
  micBtn.disabled=true; statusEl.textContent='Wish time! Your candles are out ✨'; setLevel(0); bend(false); makeConfetti();
}
function makeConfetti(){
  confetti.innerHTML='';
  for(let i=0;i<38;i++){const bit=document.createElement('i');bit.style.left=(Math.random()*100)+'%';bit.style.animationDelay=(Math.random()*1.8)+'s';bit.style.animationDuration=(2+Math.random()*2)+'s';bit.style.transform='rotate('+(Math.random()*180)+'deg)';confetti.appendChild(bit)}
}
function relight(){
  extinguished=false; flames.forEach(f=>f.classList.remove('out','bending')); patches.forEach(p=>p.style.opacity='1');
  wish.classList.remove('show'); confetti.innerHTML=''; relightBtn.style.display='none'; holdBtn.disabled=false; micBtn.disabled=false;
  blowingSince=0; setLevel(0); statusEl.textContent=micActive?'Microphone ready — blow steadily!':'Hold the button or spacebar to blow.';
}
relightBtn.addEventListener('click',relight);

async function startMic(){
  if(!navigator.mediaDevices?.getUserMedia){statusEl.textContent='Microphone unavailable here — use Hold to blow.';return}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const source=audioCtx.createMediaStreamSource(micStream); analyser=audioCtx.createAnalyser(); analyser.fftSize=1024; source.connect(analyser);
    micActive=true; micBtn.textContent='Microphone on'; micBtn.disabled=true; statusEl.textContent='Microphone ready — blow steadily!';
    const data=new Uint8Array(analyser.fftSize);
    function tick(){
      if(!analyser||extinguished)return;
      analyser.getByteTimeDomainData(data);
      let sum=0;for(let i=0;i<data.length;i++){const x=(data[i]-128)/128;sum+=x*x}
      const rms=Math.sqrt(sum/data.length);
      // A moderate sustained sound threshold avoids triggering on normal room noise.
      const level=Math.max(0,Math.min(1,(rms-.025)/.18));setLevel(level);
      if(level>.34){if(!blowingSince)blowingSince=performance.now();bend(true);statusEl.textContent='Keep blowing…';if(performance.now()-blowingSince>=520){blowOut();return}}
      else{blowingSince=0;bend(false);statusEl.textContent='Microphone ready — blow steadily!'}
      raf=requestAnimationFrame(tick);
    }
    tick();
  }catch(err){statusEl.textContent='Mic permission blocked — use Hold to blow.';micBtn.textContent='Mic unavailable';}
}
micBtn.addEventListener('click',startMic);

function holdStart(e){if(e)e.preventDefault();if(extinguished)return;holdActive=true;blowingSince=performance.now();bend(true);statusEl.textContent='Blowing… keep holding!';setLevel(.7);holdTimer=setTimeout(()=>{if(holdActive)blowOut()},520)}
function holdEnd(){holdActive=false;clearTimeout(holdTimer);if(!extinguished){blowingSince=0;bend(false);setLevel(0);statusEl.textContent=micActive?'Microphone ready — blow steadily!':'Hold the button or spacebar to blow.'}}
let holdTimer=null;
holdBtn.addEventListener('pointerdown',holdStart);['pointerup','pointerleave','pointercancel'].forEach(ev=>holdBtn.addEventListener(ev,holdEnd));
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&spread.classList.contains('open'))holdStart(e)});
window.addEventListener('keyup',e=>{if(e.code==='Space')holdEnd()});
window.addEventListener('blur',holdEnd);
window.addEventListener('pagehide',()=>{if(micStream)micStream.getTracks().forEach(t=>t.stop());if(raf)cancelAnimationFrame(raf)});
</script>
</body>
</html>
